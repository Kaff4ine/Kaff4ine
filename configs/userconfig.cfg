// half life 1 speedrun config, only works on won release of the game, some real elite SHIT

exec WON.cfg
clockwindow 0
bxt_hud_incorrect_fps_indicator 0
gl_texturemode gl_nearest 
default_fov 120
cl_showfps 1
bxt_hud_jumpspeed 1 
cl_bob 0 
gl_spriteblend 0
hud_fastswitch 1
sensitivity 1.2
volume 0.05
bxt_cross 1
bxt_cross_size 3
bxt_cross_size 5
name Kaff4ine

//viewmodel and bxt shit
default_fov 110
bxt_viewmodel_fov 130
bxt_viewmodel_ofs_forward 1.9
bxt_viewmodel_ofs_up -1
bxt_viewmodel_ofs_right 2

//general binds
bind mwheeldown +duck
bind mwheelup +jump
bind x "fps_max 100"
bind e +use
bind g "fps_max 20"
bind z "load autosave"
bind c "save hard"
bind v "load hard"
bind = "load ipad"
bind "MOUSE4" "load quick"
bind "q" "save quick"
bind h "bind mwheeldown +use"
bind b "bind mwheeldown +duck"
bind i "pause"
bind o "pause"
bind p "map c1a0;bxt_hud_timer 1;bxt_timer_reset;bxt_timer_start;bxt_autorecord run"
bind f1 "gl_texturemode GL_NEAREST_MIPMAP_NEAREST"
bind f2 "gl_texturemode GL_LINEAR_MIPMAP_LINEAR" 


//weapon binds

bind tab "weapon_gauss"
bind mouse3 "weapon_crowbar"
bind 1 weapon_9mmAR 
bind t weapon_egon
bind 3 weapon_shotgun
bind capslock weapon_hornetgun
bind 4 weapon_handgrenade

